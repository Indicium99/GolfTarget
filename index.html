<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Golf - Väylä- ja Korkeusmittari</title>

  <!-- iOS / iPhone PWA -yhteensopivuus -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Master Golf">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/6/6b/Golf_icon.png">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      overflow: hidden;
      position: fixed;
      touch-action: none;
    }
    #map {
      height: 70vh;
      width: 100%;
      cursor: crosshair;
      background-color: #0f172a;
      touch-action: none;
    }
    #info-panel {
      height: 30vh;
      padding: 8px 12px;
      box-sizing: border-box;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 2px solid #38bdf8;
      z-index: 2000;
    }
    .panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .mode-buttons {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    button {
      flex: 1;
      padding: 9px 4px;
      font-weight: bold;
      font-size: 0.9em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      text-align: center;
    }
    .btn-tee { background-color: #22c55e; color: white; }
    .btn-green { background-color: #ef4444; color: white; }
    .btn-target { background-color: #38bdf8; color: black; }
    .btn-gps-tee { background-color: #a855f7; color: white; display: none; }
    .active { outline: 3px solid #facc15; }
    
    /* ALAPALKIN SELKEÄ JA MAHTUVA RAKENNE */
    .metrics-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1e293b;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .metric-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05em;
      font-weight: bold;
    }
    .metric-subline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88em;
      color: #cbd5e1;
      border-top: 1px dashed #475569;
      padding-top: 4px;
    }
    .highlight-yellow { color: #facc15; font-size: 1.1em; }
    .highlight-blue { color: #38bdf8; }
    
    .elevation-up { color: #4ade80; }
    .elevation-down { color: #f87171; }
    .wind-tailwind { color: #4ade80; }
    .wind-headwind { color: #f87171; }

    /* GPS-Painike Kartalla */
    .gps-map-button {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .gps-active {
      background: #0284c7;
      color: #ffffff;
      border-color: #ffffff;
    }

    /* Tuulinuolityyli kartalla */
    .clean-wind-arrow-wrapper {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      pointer-events: none;
    }
    .wind-arrow-svg {
      transition: transform 0.5s ease;
      filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.9));
    }

    /* Pituusnäyttö 20 m kohdepisteen jälkeen */
    .length-badge {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #facc15;
      color: #facc15;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 6px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      pointer-events: none;
      text-align: center;
      line-height: 1.3;
    }

    /* Oma GPS-sijaintipallo */
    .gps-user-marker {
      background: #38bdf8;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #38bdf8;
    }

    .custom-green-icon, .custom-tee-icon, .custom-target-icon {
      background: transparent !important;
      border: none !important;
    }
  </style>
</head>
<body>

  <div id="map">
    <button class="gps-map-button" id="btn-gps-toggle" onclick="toggleGPS()">🎯 Oma Sijainti</button>
  </div>

  <div id="info-panel">
    <div class="panel-row">
      <div class="mode-buttons">
        <button id="btn-tee" class="btn-tee active" onclick="setMode('tee')">1. Tii</button>
        <button id="btn-green" class="btn-green" onclick="setMode('green')">2. Viheriö</button>
        <button id="btn-target" class="btn-target" onclick="setMode('target')">3. Kohde</button>
        <button id="btn-set-tee-gps" class="btn-gps-tee" onclick="setTeeToGPS()">📍 Tii GPS</button>
      </div>
    </div>

    <!-- NÄYTÖLLE MAHTUVA MITTARISTO -->
    <div class="metrics-container">
      <!-- RIVI 1: MATKAT -->
      <div class="metric-line">
        <span>Matka: <span id="dist-tee" class="highlight-blue">-</span> m</span>
        <span class="highlight-yellow">Plays like <span id="plays-like-val">-</span> m</span>
        <span>⛳ Viheriölle: <span id="dist-green" style="color:#ef4444;">-</span> m</span>
      </div>

      <!-- RIVI 2: TUULI JA LÄMPÖTILA -->
      <div class="metric-subline">
        <span id="wind-text">💨 Tuuli: -</span>
        <span id="temp-text">🌡️ -°C</span>
      </div>

      <!-- RIVI 3: KORKEUS JA SEKTORI -->
      <div class="metric-subline">
        <span>Korkeusero: <span id="elevation-diff">-</span></span>
        <span>Sektori: <span id="sector-width">-</span> m</span>
      </div>
    </div>

    <!-- ALARIVI: KOKO VÄYLÄ & VERSIOTUNNISTE -->
    <div class="panel-row" style="font-size: 0.8em; color: #94a3b8; font-family: monospace;">
      <span>📍 Tii ➔ ⛳ Koko väylä: <b id="dist-total" style="color:#38bdf8;">-</b> m</span>
      <span style="color:#facc15; font-weight: bold;">v1.0.6</span>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const APP_VERSION = "v1.0.6";

    let teePosition = [60.261447, 24.681644];   
    let greenPosition = [60.258729, 24.680158]; 
    let targetPosition = null;
    let userGPSPosition = null;

    let isTargetLocked = false;
    let currentMode = 'tee'; 
    let currentElevationDiffMeters = 0;
    let currentElevationText = "-";
    let elevationTimeout = null;

    let watchId = null;
    let userMarker = null;

    let currentWindSpeed = 0;
    let currentWindDirection = 0;
    let currentWindGusts = 0;
    let currentTempC = 20;

    const map = L.map('map', {
      maxZoom: 21,
      tap: false
    }).setView([60.260088, 24.680901], 17);

    L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
      maxZoom: 21,
      maxNativeZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: 'Map data &copy; Google'
    }).addTo(map);

    const golfTeeIcon = L.divIcon({
      className: 'custom-tee-icon',
      html: `<svg width="34" height="34" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));">
              <circle cx="16" cy="10" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="0.8"/>
              <path d="M11 16 L21 16 L17 28 L15 28 Z" fill="#22c55e" stroke="#ffffff" stroke-width="0.8"/>
            </svg>`,
      iconSize: [34, 34],
      iconAnchor: [17, 28]
    });

    const golfGreenIcon = L.divIcon({
      className: 'custom-green-icon',
      html: `<svg width="32" height="36" viewBox="0 0 32 36" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.9));">
              <line x1="8" y1="4" x2="8" y2="34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M8 4 L28 10 L8 16 Z" fill="#ef4444" stroke="#ffffff" stroke-width="0.8"/>
              <circle cx="8" cy="3" r="1.8" fill="#facc15"/>
            </svg>`,
      iconSize: [32, 36],
      iconAnchor: [8, 34]
    });

    const golfTargetIcon = L.divIcon({
      className: 'custom-target-icon',
      html: `<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
              <circle cx="16" cy="16" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2"/>
              <line x1="16" y1="0" x2="16" y2="32" stroke="#ffffff" stroke-width="1.5"/>
              <line x1="0" y1="16" x2="32" y2="16" stroke="#ffffff" stroke-width="1.5"/>
              <circle cx="16" cy="16" r="4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
            </svg>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    const userGpsIcon = L.divIcon({
      className: 'gps-user-marker',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    let teeMarker = L.marker(teePosition, {icon: golfTeeIcon, draggable: true}).addTo(map).bindPopup("Tiipaikka");
    let greenMarker = L.marker(greenPosition, {icon: golfGreenIcon, draggable: true}).addTo(map).bindPopup("Viheriö");
    let targetMarker = null;

    let centerLine = null;
    let lineToGreen = null;
    let outerSectorPolyline = null;
    let innerSectorPolyline = null;
    let arrowGroup = L.layerGroup().addTo(map);
    let distanceArcGroup = L.layerGroup().addTo(map);
    let sectorBadgeGroup = L.layerGroup().addTo(map);
    let windMarkersGroup = L.layerGroup().addTo(map);

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-tee').classList.remove('active');
      document.getElementById('btn-green').classList.remove('active');
      document.getElementById('btn-target').classList.remove('active');
      document.getElementById(`btn-${mode}`).classList.add('active');

      if (mode === 'target') {
        isTargetLocked = false;
        map.dragging.disable();
      } else {
        map.dragging.enable();
      }
    }

    function toggleGPS() {
      const gpsBtn = document.getElementById('btn-gps-toggle');
      const setTeeBtn = document.getElementById('btn-set-tee-gps');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        if (userMarker) map.removeLayer(userMarker);
        userMarker = null;
        gpsBtn.classList.remove('gps-active');
        gpsBtn.innerText = "🎯 Oma Sijainti";
        setTeeBtn.style.display = "none";
      } else {
        if (!navigator.geolocation) {
          alert("Laitteesi ei tue GPS-paikannusta.");
          return;
        }

        gpsBtn.innerText = "⌛ Paikannetaan...";

        watchId = navigator.geolocation.watchPosition(
          function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            userGPSPosition = [lat, lng];

            if (!userMarker) {
              userMarker = L.marker(userGPSPosition, {icon: userGpsIcon}).addTo(map).bindPopup("Olet tässä");
              map.setView(userGPSPosition, 18);
            } else {
              userMarker.setLatLng(userGPSPosition);
            }

            gpsBtn.classList.add('gps-active');
            gpsBtn.innerText = "📍 GPS Päällä";
            setTeeBtn.style.display = "inline-block";
          },
          function(error) {
            alert("Sijainnin hakeminen epäonnistui.");
            gpsBtn.innerText = "🎯 Oma Sijainti";
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    }

    function setTeeToGPS() {
      if (userGPSPosition) {
        teePosition = userGPSPosition;
        teeMarker.setLatLng(teePosition);
        fetchWeatherData();
        updateCalculations();
      }
    }

    function calculateDistance(pos1, pos2) {
      if (!pos1 || !pos2) return 0;
      const R = 6371e3;
      const phi1 = pos1[0] * Math.PI / 180;
      const phi2 = pos2[0] * Math.PI / 180;
      const deltaPhi = (pos2[0] - pos1[0]) * Math.PI / 180;
      const deltaLambda = (pos2[1] - pos1[1]) * Math.PI / 180;

      const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function getDestinationPoint(lat, lon, distance, bearing) {
      const R = 6371e3;
      const brng = bearing * Math.PI / 180;
      const lat1 = lat * Math.PI / 180;
      const lon1 = lon * Math.PI / 180;

      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distance / R) +
                   Math.cos(lat1) * Math.sin(distance / R) * Math.cos(brng));
      const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(distance / R) * Math.cos(lat1),
                                     Math.cos(distance / R) - Math.sin(lat1) * Math.sin(lat2));

      return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
    }

    function getBearing(pos1, pos2) {
      const lat1 = pos1[0] * Math.PI / 180;
      const lat2 = pos2[0] * Math.PI / 180;
      const dLon = (pos2[1] - pos1[1]) * Math.PI / 180;

      const y = Math.sin(dLon) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      return Math.round((Math.atan2(y, x) * 180 / Math.PI + 360) % 360);
    }

    async function fetchWeatherData() {
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${teePosition[0]}&longitude=${teePosition[1]}&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=ms`);
        const data = await response.json();

        if (data && data.current) {
          currentWindSpeed = data.current.wind_speed_10m;
          currentWindGusts = data.current.wind_gusts_10m;
          currentWindDirection = data.current.wind_direction_10m;
          currentTempC = Math.round(data.current.temperature_2m * 10) / 10;

          renderWindOverlayIcons();
          updateCalculations();
        }
      } catch (err) {
        console.log("Säätietoja ei saatu ladattua");
      }
    }

    function renderWindOverlayIcons() {
      windMarkersGroup.clearLayers();

      const dirTo = (currentWindDirection + 180) % 360;

      const windSvgHtml = `
        <div style="position: relative; width: 60px; height: 35px; display:flex; align-items:center;">
          <svg class="wind-arrow-svg" width="32" height="32" viewBox="0 0 40 40" style="transform: rotate(${dirTo}deg);">
            <path d="M20 2 L29 36 L20 30 Z" fill="#facc15" stroke="#ffffff" stroke-width="1"/>
            <path d="M20 2 L11 36 L20 30 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
          </svg>
        </div>
      `;

      const windIcon = L.divIcon({
        className: 'clean-wind-arrow-wrapper',
        html: windSvgHtml,
        iconSize: [60, 35],
        iconAnchor: [16, 16]
      });

      const teeWindPos = getDestinationPoint(teePosition[0], teePosition[1], 45, 270);
      const greenWindPos = getDestinationPoint(greenPosition[0], greenPosition[1], 45, 90);

      const teeWindMarker = L.marker(teeWindPos, { icon: windIcon, interactive: false });
      const greenWindMarker = L.marker(greenWindPos, { icon: windIcon, interactive: false });

      windMarkersGroup.addLayer(teeWindMarker);
      windMarkersGroup.addLayer(greenWindMarker);
    }

    function fetchElevationDifferenceDebounced(teePos, targetPos) {
      clearTimeout(elevationTimeout);
      elevationTimeout = setTimeout(async () => {
        try {
          const response = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${teePos[0]},${targetPos[0]}&longitude=${teePos[1]},${targetPos[1]}`);
          const data = await response.json();

          if (data && data.elevation && data.elevation.length === 2) {
            const teeElevation = data.elevation[0];
            const targetElevation = data.elevation[1];
            currentElevationDiffMeters = Math.round((targetElevation - teeElevation) * 10) / 10; 

            const diffElem = document.getElementById('elevation-diff');
            if (currentElevationDiffMeters > 0) {
              diffElem.innerHTML = `<span class="elevation-up">+${currentElevationDiffMeters} m</span>`;
            } else if (currentElevationDiffMeters < 0) {
              diffElem.innerHTML = `<span class="elevation-down">${currentElevationDiffMeters} m</span>`;
            } else {
              diffElem.innerText = "0 m";
            }
            updateBottomPanelMetrics();
          }
        } catch (err) {
          document.getElementById('elevation-diff').innerText = "-";
        }
      }, 250);
    }

    function updateBottomPanelMetrics() {
      const activeTarget = targetPosition || greenPosition;
      const distTee = calculateDistance(teePosition, activeTarget);
      const distGreen = targetPosition ? calculateDistance(targetPosition, greenPosition) : 0;
      const sectorWidthInner = Math.round(distTee * 0.1481 * 10) / 10;
      const sectorWidthOuter = Math.round(distTee * 0.2222 * 10) / 10;
      
      const shotBearing = getBearing(teePosition, activeTarget);     
      const windToDirection = (currentWindDirection + 180) % 360;      

      const angleRad = (windToDirection - shotBearing) * Math.PI / 180;
      const tailwindComponent = Math.cos(angleRad) * currentWindSpeed;
      const roundedWindComp = Math.abs(Math.round(tailwindComponent * 10) / 10);

      const windDistanceImpact = Math.round(-tailwindComponent * 0.95); 
      const tempDiff = currentTempC - 20;
      const tempDistanceImpact = Math.round(-(tempDiff / 4) * (distTee / 200)); 
      const elevationImpact = Math.round(currentElevationDiffMeters);

      const playsLikeDistance = Math.round(distTee + windDistanceImpact + tempDistanceImpact + elevationImpact);

      let windText = "";
      let windImpactFormatted = windDistanceImpact >= 0 ? `+${windDistanceImpact}m` : `${windDistanceImpact}m`;

      if (tailwindComponent > 0.2) {
        windText = `<span class="wind-tailwind">🍃 Myötä ${roundedWindComp}m/s (${windImpactFormatted})</span>`;
      } else if (tailwindComponent < -0.2) {
        windText = `<span class="wind-headwind">💨 Vastat ${roundedWindComp}m/s (${windImpactFormatted})</span>`;
      } else {
        windText = `<span>🌬️ Sivutuuli (${currentWindSpeed}m/s)</span>`;
      }

      const tempImpactFormatted = tempDistanceImpact >= 0 ? `+${tempDistanceImpact}m` : `${tempDistanceImpact}m`;

      document.getElementById('dist-tee').innerText = distTee;
      document.getElementById('plays-like-val').innerText = playsLikeDistance;
      document.getElementById('dist-green').innerText = targetPosition ? distGreen : 0;
      document.getElementById('wind-text').innerHTML = windText;
      document.getElementById('temp-text').innerHTML = `🌡️ ${currentTempC}°C (${tempImpactFormatted})`;
      document.getElementById('sector-width').innerText = `${sectorWidthInner} m / ${sectorWidthOuter} m`;
    }

    function createArcSectorPolylineByBearing(teePos, distTee, bearing, ratio, color, dashArray) {
      const deltaAngle = Math.atan(ratio / 2) * (180 / Math.PI); 

      const points = [];
      points.push(teePos);

      const leftStart = getDestinationPoint(teePos[0], teePos[1], distTee, bearing - deltaAngle);
      points.push(leftStart);

      const steps = 20;
      for (let i = 0; i <= steps; i++) {
        const currentAngle = (bearing - deltaAngle) + ((2 * deltaAngle) * (i / steps));
        const arcPt = getDestinationPoint(teePos[0], teePos[1], distTee, currentAngle);
        points.push(arcPt);
      }

      points.push(teePos);

      return L.polyline(points, {
        color: color,
        weight: 1.5,
        dashArray: dashArray,
        fill: false
      });
    }

    function drawCenterArrowExtension(startPos, bearing, extensionLength = 50) {
      arrowGroup.clearLayers();

      const endPos = getDestinationPoint(startPos[0], startPos[1], extensionLength, bearing);

      const shaft = L.polyline([startPos, endPos], {
        color: '#ffffff',
        weight: 1.5
      });
      arrowGroup.addLayer(shaft);

      const headLength = 10;
      const leftTip = getDestinationPoint(endPos[0], endPos[1], headLength, bearing + 155);
      const rightTip = getDestinationPoint(endPos[0], endPos[1], headLength, bearing - 155);

      const head = L.polyline([leftTip, endPos, rightTip], {
        color: '#ffffff',
        weight: 1.5
      });
      arrowGroup.addLayer(head);
    }

    function drawDistanceArcsByBearing(teePos, distTee, bearing, maxRatio) {
      distanceArcGroup.clearLayers();

      if (distTee < 130) return;

      const deltaAngle = Math.atan(maxRatio / 2) * (180 / Math.PI);

      for (let d = 130; d <= distTee; d += 20) {
        const arcPoints = [];
        const steps = 15;
        for (let i = 0; i <= steps; i++) {
          const currentAngle = (bearing - deltaAngle) + ((2 * deltaAngle) * (i / steps));
          const arcPt = getDestinationPoint(teePos[0], teePos[1], d, currentAngle);
          arcPoints.push(arcPt);
        }

        const arcLine = L.polyline(arcPoints, {
          color: '#ffffff',
          weight: 1,
          dashArray: null,
          opacity: 0.75
        });
        distanceArcGroup.addLayer(arcLine);
      }
    }

    function drawLengthBadgeAtArrowExtension(teePos, targetPos, distanceMeters, bearing) {
      sectorBadgeGroup.clearLayers();

      const distGreen = targetPos ? calculateDistance(targetPos, greenPosition) : calculateDistance(getDestinationPoint(teePos[0], teePos[1], distanceMeters, bearing), greenPosition);
      const badgePos = getDestinationPoint(teePos[0], teePos[1], distanceMeters + 20, bearing);

      const badgeIcon = L.divIcon({
        className: 'length-badge-container',
        html: `<div class="length-badge">
                 <div>${distanceMeters} m</div>
                 <div style="color:#ef4444; font-size:10px; font-weight:bold; margin-top:1px;">⛳ ${distGreen} m</div>
               </div>`,
        iconSize: [60, 36],
        iconAnchor: [30, 18]
      });

      const badgeMarker = L.marker(badgePos, { icon: badgeIcon, interactive: false });
      sectorBadgeGroup.addLayer(badgeMarker);
    }

    function updateCalculations() {
      const totalDist = calculateDistance(teePosition, greenPosition);
      document.getElementById('dist-total').innerText = totalDist;

      if (outerSectorPolyline) map.removeLayer(outerSectorPolyline);
      if (innerSectorPolyline) map.removeLayer(innerSectorPolyline);

      const currentTargetOrGreen = targetPosition || greenPosition;
      if (!centerLine) {
        centerLine = L.polyline([teePosition, currentTargetOrGreen], {color: '#ffffff', weight: 1.5}).addTo(map);
      } else {
        centerLine.setLatLngs([teePosition, currentTargetOrGreen]);
      }

      if (targetPosition) {
        const distTee = calculateDistance(teePosition, targetPosition);

        if (!targetMarker) {
          targetMarker = L.marker(targetPosition, {icon: golfTargetIcon}).addTo(map);
        } else {
          targetMarker.setLatLng(targetPosition);
        }

        updateBottomPanelMetrics();
        fetchElevationDifferenceDebounced(teePosition, targetPosition);

        const bearing = getBearing(teePosition, targetPosition);

        outerSectorPolyline = createArcSectorPolylineByBearing(teePosition, distTee, bearing, 0.2222, '#ffffff', null).addTo(map);
        innerSectorPolyline = createArcSectorPolylineByBearing(teePosition, distTee, bearing, 0.1481, '#ffffff', '5, 5').addTo(map);

        drawDistanceArcsByBearing(teePosition, distTee, bearing, 0.2222);
        drawCenterArrowExtension(targetPosition, bearing, 50);
        drawLengthBadgeAtArrowExtension(teePosition, targetPosition, distTee, bearing);

      } else {
        const defaultDistance = 270;
        const bearing = getBearing(teePosition, greenPosition);

        updateBottomPanelMetrics();

        outerSectorPolyline = createArcSectorPolylineByBearing(teePosition, defaultDistance, bearing, 0.2222, '#ffffff', null).addTo(map);
        innerSectorPolyline = createArcSectorPolylineByBearing(teePosition, defaultDistance, bearing, 0.1481, '#ffffff', '5, 5').addTo(map);

        drawDistanceArcsByBearing(teePosition, defaultDistance, bearing, 0.2222);

        const defaultEndPos = getDestinationPoint(teePosition[0], teePosition[1], defaultDistance, bearing);
        drawCenterArrowExtension(defaultEndPos, bearing, 50);
        drawLengthBadgeAtArrowExtension(teePosition, null, defaultDistance, bearing);
      }

      if (targetPosition) {
        if (!lineToGreen) lineToGreen = L.polyline([], {color: '#ef4444', weight: 1.5, dashArray: '4, 4'}).addTo(map);
        lineToGreen.setLatLngs([targetPosition, greenPosition]);
      } else {
        if (lineToGreen) map.removeLayer(lineToGreen);
        lineToGreen = null;
      }
    }

    function handlePointerMove(latlng) {
      if (currentMode === 'target' && !isTargetLocked) {
        targetPosition = [latlng.lat, latlng.lng];
        updateCalculations();
      }
    }

    map.on('mousemove', function(e) {
      handlePointerMove(e.latlng);
    });

    const mapElement = document.getElementById('map');
    
    mapElement.addEventListener('touchmove', function(e) {
      if (currentMode === 'target' && !isTargetLocked && e.touches.length === 1) {
        e.preventDefault();
        const touch = e.touches[0];
        const containerPoint = map.mouseEventToContainerPoint(touch);
        const latlng = map.containerPointToLatLng(containerPoint);
        handlePointerMove(latlng);
      }
    }, { passive: false });

    map.on('click', function(e) {
      const coords = [e.latlng.lat, e.latlng.lng];

      if (currentMode === 'tee') {
        teePosition = coords;
        teeMarker.setLatLng(coords);
        fetchWeatherData();
      } else if (currentMode === 'green') {
        greenPosition = coords;
        greenMarker.setLatLng(coords);
        renderWindOverlayIcons();
      } else if (currentMode === 'target') {
        if (!isTargetLocked) {
          isTargetLocked = true;
        } else {
          isTargetLocked = false;
          targetPosition = coords;
        }
      }
      updateCalculations();
    });

    teeMarker.on('dragend', function(e) {
      teePosition = [e.target.getLatLng().lat, e.target.getLatLng().lng];
      fetchWeatherData();
      updateCalculations();
    });

    greenMarker.on('dragend', function(e) {
      greenPosition = [e.target.getLatLng().lat, e.target.getLatLng().lng];
      renderWindOverlayIcons();
      updateCalculations();
    });

    updateCalculations();
    fetchWeatherData();
  </script>
</body>
</html>
