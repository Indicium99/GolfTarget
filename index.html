<html lang="fi">
<head>

    .vertical-version-tag {

    .top-header-banner {
      position: absolute;

    .map-controls-left-group {

    .map-controls-right-group {

      flex-direction: column;

      pointer-events: auto;
    }

    #search-box {
      position: absolute;
      top: 0;
      left: 50px;
      background: rgba(15, 23, 42, 0.96);
      border: 1.5px solid #0284c7;

    #search-box.open {

    #course-search-input {

    .search-result-item {

    #info-panel {
      position: absolute;
      bottom: 0;
      left: 0;

      height: 13dvh;
      min-height: 85px;
      padding: 6px 12px;
      box-sizing: border-box;
      background-color: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;

    .panel-row {

    }

    .panel-metrics {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .val-longer { color: #dc2626 !important; font-weight: bold; }
    .val-shorter { color: #16a34a !important; font-weight: bold; }
    .val-neutral { color: #ffffff !important; font-weight: bold; }
    .sg-positive { color: #16a34a !important; font-weight: bold; }
    .sg-negative { color: #dc2626 !important; font-weight: bold; }

    .toggle-group {

      color: #ffffff;
    }

    .custom-tee-marker {

    .invisible-touch-marker {

<body>

  <div id="map-wrapper">
    <div id="map"></div>
    <canvas id="sector-canvas"></canvas>
  </div>

  <div class="vertical-version-tag" id="version-tag-elem">v6.41.0 G (0)</div>

  <div class="top-header-banner">
    <div class="top-banner-line1">Tii - Lippu: <span id="dist-total">0</span>m</div>
    <div class="top-banner-line2">Tii - Kohde: <span id="top-dist-tee">0</span>m | Kohde - Lippu: <span id="top-dist-green">0</span>m</div>
  </div>

  <div class="map-controls-left-group">
    <div class="search-wrapper-left">
      <button class="control-btn" id="btn-search-toggle" onclick="toggleSearchBox(event)">🔍</button>
      <div id="search-box">
        <input type="text" id="course-search-input" placeholder="Hae kenttää..." onkeyup="if(event.key==='Enter') searchGolfCourse()">
        <button class="search-action-btn" onclick="searchGolfCourse()">Hae</button>
      </div>
      <div id="search-results-list"></div>
    </div>
    <button class="control-btn" id="btn-compass" onclick="cycleCompassMode(event)">🧭</button>
    <button class="control-btn" id="btn-zoom-in" onclick="map.zoomIn()">+</button>
    <button class="control-btn" id="btn-zoom-out" onclick="setHoleDefaultView(event)">-</button>
  </div>

  <div class="map-controls-right-group">
    <button class="control-btn" id="btn-tee" onclick="setMode('tee', event)">📍</button>
    <button class="control-btn" id="btn-target" onclick="toggleTargetMode(event)">🎯</button>
    <button class="control-btn" id="btn-green" onclick="setMode('green', event)">⛳</button>
    <button class="control-btn" id="btn-gps-toggle" onclick="toggleGPS(event)">📡</button>
    <button class="control-btn" id="btn-set-tee-gps" onclick="setTeeToGPS(event)" style="display:none;">📍GPS</button>
  </div>

  <div id="info-panel">
    <div class="panel-row">
      <div class="panel-metrics">
        PL: <span id="plays-like-val" class="val-neutral">0m</span> <span id="plays-like-gust-val"></span>
      </div>
      <div class="toggle-group">
        <button class="toggle-btn active" id="toggle-wind" onclick="toggleFactor('wind')">Tuuli</button>
        <button class="toggle-btn active" id="toggle-elev" onclick="toggleFactor('elev')">Korkeus</button>
        <button class="toggle-btn active" id="toggle-temp" onclick="toggleFactor('temp')">Lämpö</button>
      </div>
    </div>
    <div class="panel-row" style="font-size: 12.5px;">
      <span id="wind-text">💨 --</span>
      <span id="temp-text">🌡️ --</span>
      <span>📐: <span id="elevation-diff">0m</span></span>
    </div>
    <div class="panel-row" style="font-size: 12px; color: #94a3b8;">
      <span>Sektori: <span id="sector-width">0 / 0m</span></span>
      <span id="sg-val">SG: 0.0 (+0.0 / -0.2)</span>
    </div>
  </div>

  <script>
    const APP_VERSION = "v6.41.0";
    let googleApiCallCount = 0;

    function updateVersionTag() {
      const elem = document.getElementById('version-tag-elem');
      if (elem) elem.innerText = `${APP_VERSION} G (${googleApiCallCount})`;
    }

    let teePosition = [24.681644, 60.261447];
    let greenPosition = [24.680158, 60.258729];
    let targetPosition = null;
    let hole1TeePosition = [24.681644, 60.261447];

    let currentMode = 'target';
    let isTargetLocked = false;
    let lockedTargetDistance = 0;

    let userGPSPosition = null;
    let watchId = null;

    let includeWind = true;
    let includeElevation = true;
    let includeTemp = true;

    let currentWindSpeed = 3.0;
    let currentWindGusts = 5.0;
    let currentWindDirection = 210;
    let currentTempC = 18;

    let teeElevationMeters = 30;
    let targetElevationMeters = 30;
    let greenElevationMeters = 30;
    let currentElevationDiffMeters = 0;

    let compassState = 0; 
    let isInteractingWithUI = false;

    function triggerButtonGuard(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      isInteractingWithUI = true;
      setTimeout(() => { isInteractingWithUI = false; }, 300);
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'google-satellite': {
            type: 'raster',
            tiles: [
              'https://mt0.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',
              'https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}'
            ],
            tileSize: 256
          }
        },
        layers: [
          {
            id: 'google-satellite-layer',
            type: 'raster',
            source: 'google-satellite',
            minzoom: 0,
            maxzoom: 22
          }
        ]
      },
      center: teePosition,
      zoom: 16.8,
      pitch: 0,
      bearing: 0
    });

    const canvas = document.getElementById('sector-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawCanvasOverlay();
    }
    window.addEventListener('resize', resizeCanvas);

    function getDestinationPoint(lng, lat, distanceMeters, bearingDegrees) {
      const R = 6371000;
      const brng = bearingDegrees * Math.PI / 180;
      const d = distanceMeters;
      const lat1 = lat * Math.PI / 180;
      const lon1 = lng * Math.PI / 180;

      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d / R) + Math.cos(lat1) * Math.sin(d / R) * Math.cos(brng));
      const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d / R) * Math.cos(lat1), Math.cos(d / R) - Math.sin(lat1) * Math.sin(lat2));

      return [lon2 * 180 / Math.PI, lat2 * 180 / Math.PI];
    }

    function calculateDistance(coord1, coord2) {
      const R = 6371000;
      const dLat = (coord2[1] - coord1[1]) * Math.PI / 180;
      const dLon = (coord2[0] - coord1[0]) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(coord1[1] * Math.PI / 180) * Math.cos(coord2[1] * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function getBearing(coord1, coord2) {
      const dLon = (coord2[0] - coord1[0]) * Math.PI / 180;
      const lat1 = coord1[1] * Math.PI / 180;
      const lat2 = coord2[1] * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      const brng = Math.atan2(y, x) * 180 / Math.PI;
      return (brng + 360) % 360;
    }

    function getCompassDirectionText(deg) {
      const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return directions[Math.round(deg / 45) % 8];
    }

    // ==========================================
    // STROKES GAINED (SG) LASKENTAFUNKTIO
    // Versio v6.41.0: Avauslyönti tiiltä (Tee-to-Fairway)
    // ==========================================
    function calculateTeeTeeSgSingle(shotDist, remGreen) {
      if (!shotDist || remGreen === undefined || remGreen === null) return 0;
      
      const yardsTee = (shotDist + remGreen) * 1.09361;
      const yardsRem = remGreen * 1.09361;
      
      const expTee = 1.15 + 0.0090 * yardsTee;
      const expFwRem = 0.82 + 0.0084 * yardsRem;
      
      const sgValue = expTee - (expFwRem + 1);
      return sgValue;
    }

    function renderApproachSgTriolText(distStart, distRem) {
      if (!distStart || !distRem) return "+0.0 (-0.1 / -0.3)";
      
      const yardsStart = distStart * 1.09361;
      const yardsRem = distRem * 1.09361;

      const expStart = 0.82 + 0.0084 * yardsStart;
      const expRemFw = 0.82 + 0.0084 * yardsRem;
      const expRemRough = 1.15 + 0.0092 * yardsRem;
      const expRemSand = 1.45 + 0.0098 * yardsRem;

      const sgFw = expStart - (expRemFw + 1);
      const sgRough = expStart - (expRemRough + 1);
      const sgSand = expStart - (expRemSand + 1);

      const fmt = (v) => (v >= 0 ? `+${v.toFixed(1)}` : v.toFixed(1));
      return `${fmt(sgFw)} (${fmt(sgRough)} / ${fmt(sgSand)})`;
    }

    function renderStrokesGainedHTML(distStart, distRem) {
      if (!distStart || !distRem) return "SG: 0.0 (+0.0 / -0.2)";
      
      const yardsStart = distStart * 1.09361;
      const yardsRem = distRem * 1.09361;

      const expStart = 0.82 + 0.0084 * yardsStart;
      const expRemFw = 0.82 + 0.0084 * yardsRem;
      const expRemRough = 1.15 + 0.0092 * yardsRem;
      const expRemSand = 1.45 + 0.0098 * yardsRem;

      const sgFw = expStart - (expRemFw + 1);
      const sgRough = expStart - (expRemRough + 1);
      const sgSand = expStart - (expRemSand + 1);

      const fmtVal = (val) => {
        const text = val >= 0 ? `+${val.toFixed(1)}` : val.toFixed(1);
        const cls = val < 0 ? "sg-negative" : "sg-positive";
        return `<span class="${cls}">${text}</span>`;
      };

      return `SG: ${fmtVal(sgFw)} (${fmtVal(sgRough)} / ${fmtVal(sgSand)})`;
    }

    function autoPositionTarget() {
      const activeOrigin = userGPSPosition || teePosition;
      const totalDist = calculateDistance(activeOrigin, greenPosition);
      const bearing = getBearing(activeOrigin, greenPosition);
      targetPosition = getDestinationPoint(activeOrigin[0], activeOrigin[1], Math.min(270, totalDist * 0.7), bearing);
    }

    let hole1TeeEl = document.createElement('div');
    hole1TeeEl.className = 'custom-tee-marker';
    hole1TeeEl.innerText = '1 Tee';
    let hole1TeeMarker = new maplibregl.Marker({ element: hole1TeeEl, anchor: 'center' })
      .setLngLat(hole1TeePosition)
      .addTo(map);

    let teeEl = document.createElement('div');
    teeEl.className = 'custom-tee-marker';
    teeEl.innerText = '📍 Tee';
    let teeMarker = new maplibregl.Marker({ element: teeEl, anchor: 'center' })
      .setLngLat(teePosition)
      .addTo(map);

    let greenTouchEl = document.createElement('div');
    greenTouchEl.className = 'invisible-touch-marker';
    let greenMarker = new maplibregl.Marker({ element: greenTouchEl, anchor: 'center' })
      .setLngLat(greenPosition)
      .addTo(map);

    let targetTouchEl = document.createElement('div');
    targetTouchEl.className = 'invisible-touch-marker';
    let targetTouchMarker = new maplibregl.Marker({ element: targetTouchEl, anchor: 'center' })
      .setLngLat(teePosition);

    autoPositionTarget();

    function drawElevationBadge(x, y, diffMeters) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, 14, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(241, 245, 249, 1.0)';
      ctx.fill();
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (diffMeters > 0) {
        ctx.fillStyle = '#dc2626';
        ctx.fillText(`+${diffMeters}m`, x, y);
      } else if (diffMeters < 0) {
        ctx.fillStyle = '#16a34a';
        ctx.fillText(`${diffMeters}m`, x, y);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillText(`0m`, x, y);
      }
      ctx.restore();
    }

    function drawCanvasOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const activeOrigin = userGPSPosition || teePosition;
      const totalDist = calculateDistance(activeOrigin, greenPosition);
      const isPar3 = totalDist < 200;

      const pTee = map.project(activeOrigin);
      const pGreen = map.project(greenPosition);

      const activeTarget = isPar3 ? greenPosition : (targetPosition || greenPosition);
      const targetToGreenDist = calculateDistance(activeTarget, greenPosition);
      const distanceForDispersion = isPar3 ? totalDist : targetToGreenDist;

      // 1. LIPUN HAJONTAYMPYRÄT (3m, 5m, 7m) JA RISTIKKO
      const r3Point = map.project(getDestinationPoint(greenPosition[0], greenPosition[1], Math.max(3, distanceForDispersion * 0.03), 90));
      const r5Point = map.project(getDestinationPoint(greenPosition[0], greenPosition[1], distanceForDispersion * 0.05, 90));
      const r7Point = map.project(getDestinationPoint(greenPosition[0], greenPosition[1], distanceForDispersion * 0.07, 90));

      const pxRadius3 = Math.hypot(r3Point.x - pGreen.x, r3Point.y - pGreen.y);
      const pxRadius5 = Math.hypot(r5Point.x - pGreen.x, r5Point.y - pGreen.y);
      const pxRadius7 = Math.hypot(r7Point.x - pGreen.x, r7Point.y - pGreen.y);

      // 5% Ympyrä
      ctx.beginPath();
      ctx.arc(pGreen.x, pGreen.y, pxRadius5, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(250, 204, 21, 0.15)';
      ctx.fill();
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.stroke();

      // 7% Ympyrä
      ctx.beginPath();
      ctx.arc(pGreen.x, pGreen.y, pxRadius7, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(248, 113, 113, 0.08)';
      ctx.fill();
      ctx.strokeStyle = '#f87171';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 3]);
      ctx.stroke();

      ctx.setLineDash([]);

      // 3% Ympyrä & Crosshair-tähtäin
      ctx.beginPath();
      ctx.arc(pGreen.x, pGreen.y, Math.max(4, pxRadius3), 0, 2 * Math.PI);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pGreen.x - pxRadius3 - 5, pGreen.y);
      ctx.lineTo(pGreen.x + pxRadius3 + 5, pGreen.y);
      ctx.moveTo(pGreen.x, pGreen.y - pxRadius3 - 5);
      ctx.lineTo(pGreen.x, pGreen.y + pxRadius3 + 5);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(pGreen.x, pGreen.y, 2.5, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Sädemitat (kello 03:00 / +90 deg)
      const label3h = map.project(getDestinationPoint(greenPosition[0], greenPosition[1], distanceForDispersion * 0.07, 90));
      ctx.font = 'bold 11px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('3m / 5m / 7m', label3h.x + 6, label3h.y);

      // Lähestymislyönnin SG-trioli (kello 04:30 / 135 deg)
      const label430 = map.project(getDestinationPoint(greenPosition[0], greenPosition[1], distanceForDispersion * 0.07 + 3, 135));
      const approachSgText = renderApproachSgTriolText(calculateDistance(activeOrigin, activeTarget), calculateDistance(activeTarget, greenPosition));
      ctx.font = 'bold 13px Arial';
      ctx.fillStyle = '#4ade80';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(approachSgText, label430.x, label430.y);

      // Lipun lähestymisnuoli (20m eteenpäin lipun takana)
      const targetToGreenBearing = getBearing(activeTarget, greenPosition);
      const pGreenArrowEnd = map.project(getDestinationPoint(greenPosition[0], greenPosition[1], 20, targetToGreenBearing));
      const pGreenLeftTip = map.project(getDestinationPoint(greenPosition[0], greenPosition[1], 15, targetToGreenBearing + 1.6));
      const pGreenRightTip = map.project(getDestinationPoint(greenPosition[0], greenPosition[1], 15, targetToGreenBearing - 1.6));

      ctx.beginPath();
      ctx.moveTo(pGreen.x, pGreen.y);
      ctx.lineTo(pGreenArrowEnd.x, pGreenArrowEnd.y);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pGreenLeftTip.x, pGreenLeftTip.y);
      ctx.lineTo(pGreenArrowEnd.x, pGreenArrowEnd.y);
      ctx.lineTo(pGreenRightTip.x, pGreenRightTip.y);
      ctx.closePath();
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 0.8;
      ctx.stroke();

      if (!isPar3 && targetElevationMeters !== undefined && greenElevationMeters !== undefined) {
        const diffTargetGreen = Math.round(greenElevationMeters - targetElevationMeters);
        const pLabelTargetGreen = map.project(getDestinationPoint(greenPosition[0], greenPosition[1], 12, targetToGreenBearing));
        drawElevationBadge(pLabelTargetGreen.x, pLabelTargetGreen.y, diffTargetGreen);
      }

      // 2. SEKTORI JA AVAUSLYÖNTI
      if (isPar3) {
        ctx.beginPath();
        ctx.moveTo(pTee.x, pTee.y);
        ctx.lineTo(pGreen.x, pGreen.y);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        const diffTeeGreen = Math.round(greenElevationMeters - teeElevationMeters);
        const pLabelTeeGreen = map.project(getDestinationPoint(greenPosition[0], greenPosition[1], 10, getBearing(activeOrigin, greenPosition)));
        drawElevationBadge(pLabelTeeGreen.x, pLabelTeeGreen.y, diffTeeGreen);
      } else {
        const pTarget = map.project(activeTarget);
        const distTee = calculateDistance(activeOrigin, activeTarget);
        const bearing = getBearing(activeOrigin, activeTarget);

        ctx.beginPath();
        ctx.moveTo(pTee.x, pTee.y);
        ctx.lineTo(pTarget.x, pTarget.y);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 50m Sektorinuoli & kapea 5m terävä kärki (+-1.6 deg)
        const pArrowEnd = map.project(getDestinationPoint(activeTarget[0], activeTarget[1], 50, bearing));
        const pLeftTip = map.project(getDestinationPoint(activeTarget[0], activeTarget[1], 45, bearing + 1.6));
        const pRightTip = map.project(getDestinationPoint(activeTarget[0], activeTarget[1], 45, bearing - 1.6));

        ctx.beginPath();
        ctx.moveTo(pTarget.x, pTarget.y);
        ctx.lineTo(pArrowEnd.x, pArrowEnd.y);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(pLeftTip.x, pLeftTip.y);
        ctx.lineTo(pArrowEnd.x, pArrowEnd.y);
        ctx.lineTo(pRightTip.x, pRightTip.y);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 0.8;
        ctx.stroke();

        // Mittatekstien sijoittelu 10m kohteesta eteenpäin + 2m oikealle (bearing + 90)
        const pTextCenter = map.project(getDestinationPoint(activeTarget[0], activeTarget[1], 10, bearing));
        const perpBearing = (bearing + 90) % 360;
        const pTextOffset = map.project(getDestinationPoint(
          map.unproject(pTextCenter).lng,
          map.unproject(pTextCenter).lat,
          2,
          perpBearing
        ));

        const distTeeVal = Math.round(distTee);
        const shotBearing = getBearing(activeOrigin, activeTarget);
        const windToDirection = (currentWindDirection + 180) % 360;
        const angleRad = (windToDirection - shotBearing) * Math.PI / 180;
        const tailwindComponent = Math.cos(angleRad) * currentWindSpeed;
        const gustTailwindComponent = Math.cos(angleRad) * currentWindGusts;
        const distanceRatio = distTee / 200;

        let windDistImp = 0;
        let gustDistImp = 0;
        if (includeWind) {
          if (tailwindComponent < 0) {
            windDistImp = Math.round(-tailwindComponent * 1.65 * distanceRatio);
            gustDistImp = Math.round(-gustTailwindComponent * 1.65 * distanceRatio);
          } else {
            windDistImp = Math.round(-tailwindComponent * 0.90 * distanceRatio);
            gustDistImp = Math.round(-gustTailwindComponent * 0.90 * distanceRatio);
          }
        }
        const tempDiff = currentTempC - 20;
        const tempDistImp = includeTemp ? Math.round(-(tempDiff * 0.002) * distTee) : 0;
        const elevImp = includeElevation ? Math.round(currentElevationDiffMeters * 1.15) : 0;

        const plDistVal = Math.round(distTee + windDistImp + tempDistImp + elevImp);
        const plGustVal = Math.round(distTee + gustDistImp + tempDistImp + elevImp);

        let plColor = "#ffffff";
        if (plDistVal > distTeeVal) plColor = "#dc2626";
        else if (plDistVal < distTeeVal) plColor = "#16a34a";

        let plGustColor = "#ffffff";
        if (plGustVal > distTeeVal) plGustColor = "#dc2626";
        else if (plGustVal < distTeeVal) plGustColor = "#16a34a";

        const windSpeedInt = Math.round(currentWindSpeed);
        const gustSpeedInt = Math.round(currentWindGusts);

        ctx.font = 'bold 15px Arial';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        let currentX = pTextOffset.x;
        const currentY = pTextOffset.y;

        const part1 = `${distTeeVal}m  PL `;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(part1, currentX, currentY);
        currentX += ctx.measureText(part1).width;

        const part2 = `${plDistVal}m`;
        ctx.fillStyle = plColor;
        ctx.fillText(part2, currentX, currentY);
        currentX += ctx.measureText(part2).width;

        if (includeWind && Math.abs(gustSpeedInt - windSpeedInt) >= 1) {
          const part3a = ' (';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(part3a, currentX, currentY);
          currentX += ctx.measureText(part3a).width;

          const part3b = `${plGustVal}m`;
          ctx.fillStyle = plGustColor;
          ctx.fillText(part3b, currentX, currentY);
          currentX += ctx.measureText(part3b).width;

          const part3c = ` ${gustSpeedInt}m/s)`;
          ctx.fillStyle = '#ffffff';
          ctx.fillText(part3c, currentX, currentY);
        }

        // Korkeuseron badge 20m kohdalla nuolen rungolla
        const diffTeeTarget = Math.round(targetElevationMeters - teeElevationMeters);
        const pLabelTeeTarget = map.project(getDestinationPoint(activeTarget[0], activeTarget[1], 20, bearing));
        drawElevationBadge(pLabelTeeTarget.x, pLabelTeeTarget.y, diffTeeTarget);

        // Sektorin ulkoreunat ja 20m välikaaret + Tee-to-Fairway SG-luvut
        const deltaAngle = Math.atan(0.2222 / 2) * (180 / Math.PI);
        const leftAngle = bearing - deltaAngle;
        const rightAngle = bearing + deltaAngle;

        const pLeftEnd = map.project(getDestinationPoint(activeOrigin[0], activeOrigin[1], distTee, leftAngle));
        const pRightEnd = map.project(getDestinationPoint(activeOrigin[0], activeOrigin[1], distTee, rightAngle));

        ctx.beginPath();
        ctx.moveTo(pTee.x, pTee.y);
        ctx.lineTo(pLeftEnd.x, pLeftEnd.y);
        ctx.moveTo(pTee.x, pTee.y);
        ctx.lineTo(pRightEnd.x, pRightEnd.y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        for (let d = 140; d <= distTee; d += 20) {
          const arcPoints = [];
          const steps = 10;
          for (let i = 0; i <= steps; i++) {
            const currAngle = leftAngle + ((rightAngle - leftAngle) * (i / steps));
            const pt = map.project(getDestinationPoint(activeOrigin[0], activeOrigin[1], d, currAngle));
            arcPoints.push(pt);
          }

          ctx.beginPath();
          ctx.moveTo(arcPoints[0].x, arcPoints[0].y);
          for (let i = 1; i < arcPoints.length; i++) {
            ctx.lineTo(arcPoints[i].x, arcPoints[i].y);
          }
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1;
          ctx.stroke();

          const quarterLeftAngle = bearing - (deltaAngle / 2);
          const quarterRightAngle = bearing + (deltaAngle / 2);

          const pSgPos = map.project(getDestinationPoint(activeOrigin[0], activeOrigin[1], d, quarterLeftAngle));
          const pDistPos = map.project(getDestinationPoint(activeOrigin[0], activeOrigin[1], d, quarterRightAngle));

          const centerPtArc = getDestinationPoint(activeOrigin[0], activeOrigin[1], d, bearing);
          const remToGreen = calculateDistance(centerPtArc, greenPosition);
          
          const sgVal = calculateTeeTeeSgSingle(d, remToGreen);
          const sgText = sgVal >= 0 ? `+${sgVal.toFixed(1)}` : sgVal.toFixed(1);

          ctx.font = 'bold 13px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillStyle = sgVal >= 0 ? '#16a34a' : '#dc2626';
          ctx.fillText(sgText, pSgPos.x, pSgPos.y - 3);

          ctx.font = '12px Arial';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`${d}m`, pDistPos.x, pDistPos.y - 3);
        }
      }
    }

    async function triggerElevationUpdate() {
      const activeOrigin = userGPSPosition || teePosition;
      
      try {
        if (window.google && google.maps && google.maps.ElevationService) {
          googleApiCallCount++;
          updateVersionTag();
          
          const elevator = new google.maps.ElevationService();
          const locations = [
            { lat: activeOrigin[1], lng: activeOrigin[0] },
            { lat: greenPosition[1], lng: greenPosition[0] }
          ];

          if (targetPosition) {
            locations.push({ lat: targetPosition[1], lng: targetPosition[0] });
          }

          elevator.getElevationForLocations({ locations: locations }, (results, status) => {
            if (status === 'OK' && results) {
              teeElevationMeters = Math.round(results[0].elevation);
              greenElevationMeters = Math.round(results[1].elevation);
              if (targetPosition && results[2]) {
                targetElevationMeters = Math.round(results[2].elevation);
              } else {
                targetElevationMeters = greenElevationMeters;
              }
              currentElevationDiffMeters = Math.round(greenElevationMeters - teeElevationMeters);
              renderElevationUI();
            } else {
              fetchOpenMeteoElevation();
            }
          });
        } else {
          fetchOpenMeteoElevation();
        }
      } catch (e) {
        fetchOpenMeteoElevation();
      }
    }

    async function fetchOpenMeteoElevation() {
      const activeOrigin = userGPSPosition || teePosition;
      let lats = `${activeOrigin[1]},${greenPosition[1]}`;
      let lons = `${activeOrigin[0]},${greenPosition[0]}`;

      if (targetPosition) {
        lats += `,${targetPosition[1]}`;
        lons += `,${targetPosition[0]}`;
      }

      try {
        const res = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`);
        const data = await res.json();
        if (data && data.elevation) {
          teeElevationMeters = Math.round(data.elevation[0]);
          greenElevationMeters = Math.round(data.elevation[1]);
          if (targetPosition && data.elevation[2] !== undefined) {
            targetElevationMeters = Math.round(data.elevation[2]);
          } else {
            targetElevationMeters = greenElevationMeters;
          }
          currentElevationDiffMeters = Math.round(greenElevationMeters - teeElevationMeters);
          renderElevationUI();
        }
      } catch (e) {
        console.error("Open-Meteo Elevation epäonnistui:", e);
      }
    }

    function renderElevationUI() {
      const diffElem = document.getElementById('elevation-diff');
      if (currentElevationDiffMeters > 0) {
        diffElem.innerHTML = `<span class="val-longer">+${currentElevationDiffMeters}m</span>`;
      } else if (currentElevationDiffMeters < 0) {
        diffElem.innerHTML = `<span class="val-shorter">${currentElevationDiffMeters}m</span>`;
      } else {
        diffElem.innerText = "0m";
      }
      
      updateBottomPanelMetrics();
      drawCanvasOverlay();
    }

    async function fetchWeatherData() {
      const activeOrigin = userGPSPosition || teePosition;
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${activeOrigin[1]}&longitude=${activeOrigin[0]}&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m`;
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.current) {
          currentTempC = Math.round(data.current.temperature_2m);
          currentWindSpeed = data.current.wind_speed_10m;
          currentWindDirection = data.current.wind_direction_10m;
          currentWindGusts = data.current.wind_gusts_10m || (currentWindSpeed * 1.5);
          updateCalculations();
        }
      } catch (e) {
        console.error("Säätietojen haku epäonnistui:", e);
      }
    }

    function toggleFactor(type) {
      if (type === 'wind') {
        includeWind = !includeWind;
        document.getElementById('toggle-wind').classList.toggle('active', includeWind);
      } else if (type === 'elev') {
        includeElevation = !includeElevation;
        document.getElementById('toggle-elev').classList.toggle('active', includeElevation);
      } else if (type === 'temp') {
        includeTemp = !includeTemp;
        document.getElementById('toggle-temp').classList.toggle('active', includeTemp);
      }
      updateBottomPanelMetrics();
      drawCanvasOverlay();
    }

      triggerButtonGuard(e);
      const box = document.getElementById('search-box');
      box.classList.toggle('open');
      if (box.classList.contains('open')) {
        document.getElementById('course-search-input').focus();

      if (resultsElem) resultsElem.classList.remove('open');
    }

    async function searchGolfCourse() {
      const inputElem = document.getElementById('course-search-input');
      const searchQuery = inputElem.value.trim();
      if (!searchQuery) return;

      closeSearchResults();

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=6`;
      try {
        const response = await fetch(url, {
          headers: { 'User-Agent': 'MasterGolfApp/6.41.0' }
        });
        const results = await response.json();

        if (results && results.length > 0) {
          showSearchResultsList(results);
        } else {
          alert("Hakutuloksia ei löytynyt. Kokeile toista hakusanaa.");
        }
      } catch (err) {
        console.error("Kentän haku epäonnistui:", err);
        alert("Haku epäonnistui. Tarkista verkkoyhteys.");
      }
    }

    async function showSearchResultsList(results) {
      const listElem = document.getElementById('search-results-list');
      listElem.innerHTML = '';

      for (const item of results) {
        const lat = parseFloat(item.lat);
        const lon = parseFloat(item.lon);

        const isMaster = item.display_name.toLowerCase().includes("master golf") || (Math.abs(lat - 60.2614) < 0.03 && Math.abs(lon - 24.6816) < 0.03);

        if (isMaster) {
          const masterHoles = await queryOverpassCourses(lat, lon);
          if (masterHoles && masterHoles.length > 0) {
            masterHoles.forEach(h => {
              const div = document.createElement('div');
              div.className = 'search-result-item';
              div.innerText = `${h.courseName} - ${h.holeName}`;
              div.onclick = (e) => {
                triggerButtonGuard(e);
                applyHoleData(h);
              };
              listElem.appendChild(div);
            });
            continue;
          }
        }

        const div = document.createElement('div');
        div.className = 'search-result-item';
        div.innerText = item.display_name;
        div.onclick = (e) => {
          triggerButtonGuard(e);
          selectSearchResult(item.lat, item.lon, item.display_name);
        };
        listElem.appendChild(div);
      }

      listElem.classList.add('open');
    }

      return [

          courseName: 'Master Golf (Master Course)',
          holeName: '1 Tee',
          teePos: [24.681644, 60.261447],
          greenPos: [24.680158, 60.258729]
        },
        {
          courseName: 'Master Golf (Forest Course)',

        }
      ];

    function applyHoleData(hole) {
      closeSearchResults();
      document.getElementById('search-box').classList.remove('open');

      hole1TeePosition = hole.teePos;
      if (hole1TeeMarker) hole1TeeMarker.setLngLat(hole1TeePosition);

      teePosition = hole.teePos;
      greenPosition = hole.greenPos;

      const bearing = getBearing(teePosition, greenPosition);
      const dist = calculateDistance(teePosition, greenPosition);
      targetPosition = hole.centerPos || getDestinationPoint(teePosition[0], teePosition[1], Math.min(270, dist * 0.7), bearing);

      teeMarker.setLngLat(teePosition);
      greenMarker.setLngLat(greenPosition);
      if (targetTouchMarker) targetTouchMarker.setLngLat(targetPosition);

      map.flyTo({ center: teePosition, zoom: 17.2, duration: 1000 });

      fetchWeatherData();
      updateCalculations();
      triggerElevationUpdate();
      updateVersionTag();
    }

    async function selectSearchResult(latStr, lonStr, displayName) {
      closeSearchResults();
      document.getElementById('search-box').classList.remove('open');

      const lat = parseFloat(latStr);
      const lon = parseFloat(lonStr);

      hole1TeePosition = [lon, lat];
      if (hole1TeeMarker) hole1TeeMarker.setLngLat(hole1TeePosition);

      teePosition = [lon, lat];
      greenPosition = getDestinationPoint(lon, lat, 350, 0);

      const bearing = getBearing(teePosition, greenPosition);
      targetPosition = getDestinationPoint(teePosition[0], teePosition[1], 270, bearing);

      teeMarker.setLngLat(teePosition);
      greenMarker.setLngLat(greenPosition);
      if (targetTouchMarker) targetTouchMarker.setLngLat(targetPosition);

      map.flyTo({ center: teePosition, zoom: 17.0, duration: 1000 });

      fetchWeatherData();
      updateCalculations();
      triggerElevationUpdate();
      updateVersionTag();
    }

    function cycleCompassMode(e) {
      triggerButtonGuard(e);
      const compassBtn = document.getElementById('btn-compass');

      const activeOrigin = userGPSPosition || teePosition;
      const holeBearing = getBearing(activeOrigin, greenPosition);

      if (compassState === 0) {
        compassState = 1;
        map.setBearing(holeBearing);
        map.dragRotate.disable();
        compassBtn.innerText = "🔒";
        compassBtn.classList.add('locked');
      } else if (compassState === 1) {
        compassState = 2;
        map.setBearing(0);
        map.dragRotate.disable();
        compassBtn.innerText = "🔒N";
        compassBtn.classList.add('locked');
      } else {
        compassState = 0;
        map.dragRotate.enable();
        compassBtn.innerText = "🧭";
        compassBtn.classList.remove('locked');
      }
    }

    function setHoleDefaultView(e) {
      triggerButtonGuard(e);
      const activeOrigin = userGPSPosition || teePosition;
      const bounds = new maplibregl.LngLatBounds();
      bounds.extend(activeOrigin);
      bounds.extend(greenPosition);
      if (targetPosition) bounds.extend(targetPosition);

      map.fitBounds(bounds, {
        padding: { top: 80, bottom: 120, left: 50, right: 50 },
        duration: 800
      });
    }

    function updateModeButtonsUI() {
      document.getElementById('btn-tee').classList.remove('active-mode');
      document.getElementById('btn-green').classList.remove('active-mode');
      const targetBtn = document.getElementById('btn-target');
      targetBtn.classList.remove('active-mode', 'locked');

      if (currentMode === 'tee') {
        document.getElementById('btn-tee').classList.add('active-mode');
      } else if (currentMode === 'green') {
        document.getElementById('btn-green').classList.add('active-mode');
      } else if (currentMode === 'target') {
        targetBtn.classList.add('active-mode');
        if (isTargetLocked) {
          targetBtn.classList.add('locked');
          targetBtn.innerText = "🔒";
        } else {
          targetBtn.innerText = "🎯";
        }
      }
    }

    function setMode(mode, e) {
      triggerButtonGuard(e);
      currentMode = mode;
      isTargetLocked = false;
      updateModeButtonsUI();
    }

    function toggleTargetMode(e) {
      triggerButtonGuard(e);

      if (currentMode !== 'target') {
        currentMode = 'target';
        isTargetLocked = false;
      } else {
        isTargetLocked = !isTargetLocked;

        if (isTargetLocked) {
          const activeOrigin = userGPSPosition || teePosition;
          const activeTarget = targetPosition || greenPosition;
          lockedTargetDistance = calculateDistance(activeOrigin, activeTarget);
        }
      }

      updateModeButtonsUI();
      updateCalculations();
    }

    function toggleGPS(e) {
      triggerButtonGuard(e);
      const gpsBtn = document.getElementById('btn-gps-toggle');
      const setTeeBtn = document.getElementById('btn-set-tee-gps');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        userGPSPosition = null;
        gpsBtn.classList.remove('active-mode');
        setTeeBtn.style.display = "none";
        updateCalculations();
      } else {
        if (!navigator.geolocation) {
          alert("Laitteesi ei tue GPS-paikannusta.");
          return;
        }

        watchId = navigator.geolocation.watchPosition(
          function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            userGPSPosition = [lng, lat];

            gpsBtn.classList.add('active-mode');
            setTeeBtn.style.display = "flex";

            updateCalculations();
          },
          function(err) {
            console.error("GPS virhe:", err);
            alert("GPS-paikannus epäonnistui.");
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 1000 }
        );
      }
    }

    function setTeeToGPS(e) {
      triggerButtonGuard(e);
      if (userGPSPosition) {
        teePosition = userGPSPosition;
        teeMarker.setLngLat(teePosition);
        fetchWeatherData();
        updateCalculations();
        triggerElevationUpdate();
      }
    }

    function updateBottomPanelMetrics() {
      const activeOrigin = userGPSPosition || teePosition;
      const totalDistToGreen = calculateDistance(activeOrigin, greenPosition);
      const isPar3 = totalDistToGreen < 200;

      const activeTarget = isPar3 ? greenPosition : (targetPosition || greenPosition);
      const distTee = calculateDistance(activeOrigin, activeTarget);
      const distGreen = isPar3 ? totalDistToGreen : (targetPosition ? calculateDistance(activeTarget, greenPosition) : totalDistToGreen);

      const sectorWidthInner = Math.round(distTee * 0.1481);
      const sectorWidthOuter = Math.round(distTee * 0.2222);

      const shotBearing = getBearing(activeOrigin, activeTarget);
      const windToDirection = (currentWindDirection + 180) % 360;
      const angleRad = (windToDirection - shotBearing) * Math.PI / 180;
      const tailwindComponent = Math.cos(angleRad) * currentWindSpeed;
      const gustTailwindComponent = Math.cos(angleRad) * currentWindGusts;

      const distanceRatio = distTee / 200;
      let windDistanceImpact = 0;
      let gustDistanceImpact = 0;

      if (includeWind) {
        if (tailwindComponent < 0) {
          windDistanceImpact = Math.round(-tailwindComponent * 1.65 * distanceRatio);
          gustDistanceImpact = Math.round(-gustTailwindComponent * 1.65 * distanceRatio);
        } else {
          windDistanceImpact = Math.round(-tailwindComponent * 0.90 * distanceRatio);
          gustDistanceImpact = Math.round(-gustTailwindComponent * 0.90 * distanceRatio);
        }
      }

      const tempDiff = currentTempC - 20;
      const tempDistanceImpact = includeTemp ? Math.round(-(tempDiff * 0.002) * distTee) : 0;
      const elevationImpact = includeElevation ? Math.round(currentElevationDiffMeters * 1.15) : 0;

      const playsLikeDistance = Math.round(distTee + windDistanceImpact + tempDistanceImpact + elevationImpact);
      const playsLikeGustDistance = Math.round(distTee + gustDistanceImpact + tempDistanceImpact + elevationImpact);

      let windImpactFormatted = windDistanceImpact >= 0 ? `+${windDistanceImpact}m` : `${windDistanceImpact}m`;
      const windSpeedInt = Math.round(currentWindSpeed);
      const gustSpeedInt = Math.round(currentWindGusts);

      let windValClass = "val-neutral";
      if (tailwindComponent > 0.2) windValClass = "val-shorter";
      else if (tailwindComponent < -0.2) windValClass = "val-longer";

      let windDirectionLabel = "Sivutuuli";
      if (tailwindComponent > 0.2) windDirectionLabel = "Myötä";
      else if (tailwindComponent < -0.2) windDirectionLabel = "Vasta";

      const compassStr = getCompassDirectionText(currentWindDirection);
      const windText = `💨 <span class="${windValClass}">${compassStr} ${windDirectionLabel} ${windSpeedInt} m/s (${windImpactFormatted})</span>`;

      let tempValClass = "val-neutral";
      if (tempDistanceImpact > 0) tempValClass = "val-longer";
      else if (tempDistanceImpact < 0) tempValClass = "val-shorter";

      const tempImpactFormatted = tempDistanceImpact >= 0 ? `+${tempDistanceImpact}m` : `${tempDistanceImpact}m`;

      document.getElementById('top-dist-tee').innerText = distTee;
      document.getElementById('top-dist-green').innerText = distGreen;
      document.getElementById('sector-width').innerText = `${sectorWidthInner} / ${sectorWidthOuter}m`;

      document.getElementById('sg-val').innerHTML = renderStrokesGainedHTML(distTee, distGreen);

      const playsLikeElem = document.getElementById('plays-like-val');

      let playsLikeClass = "val-neutral";
      if (playsLikeDistance > distTee) playsLikeClass = "val-longer";
      else if (playsLikeDistance < distTee) playsLikeClass = "val-shorter";

      playsLikeElem.innerHTML = `<span class="${playsLikeClass}">${playsLikeDistance}m</span>`;

      const gustElem = document.getElementById('plays-like-gust-val');
      if (includeWind && Math.abs(gustSpeedInt - windSpeedInt) >= 1) {
        let gustClass = "val-neutral";
        if (playsLikeGustDistance > distTee) gustClass = "val-longer";
        else if (playsLikeGustDistance < distTee) gustClass = "val-shorter";

        gustElem.innerHTML = `(<span class="${gustClass}">${playsLikeGustDistance}m</span> ${gustSpeedInt} m/s)`;
      } else {
        gustElem.innerText = '';
      }

      document.getElementById('wind-text').innerHTML = windText;
      document.getElementById('temp-text').innerHTML = `🌡️ <span class="${tempValClass}">${currentTempC}°C (${tempImpactFormatted})</span>`;
    }

    function updateCalculations() {
      const activeOrigin = userGPSPosition || teePosition;
      const totalDist = calculateDistance(activeOrigin, greenPosition);
      document.getElementById('dist-total').innerText = totalDist;

      const isPar3 = totalDist < 200;

      if (isPar3) {
        if (targetTouchMarker) targetTouchMarker.remove();
      } else {
        const currentTargetOrGreen = targetPosition || greenPosition;
        if (targetTouchMarker && !targetTouchMarker._map) targetTouchMarker.addTo(map);
        if (targetTouchMarker) targetTouchMarker.setLngLat(currentTargetOrGreen);
      }

      drawCanvasOverlay();
      updateBottomPanelMetrics();
    }

    function getOffsetLngLatFromPoint(point) {
      return map.unproject(point);
    }

    map.on('click', (e) => {
      if (isInteractingWithUI) return;

      closeSearchResults();

      const lngLat = getOffsetLngLatFromPoint(e.point);
      const coords = [lngLat.lng, lngLat.lat];

      if (currentMode === 'tee') {
        teePosition = coords;
        teeMarker.setLngLat(coords);
        fetchWeatherData();
      } else if (currentMode === 'green') {
        greenPosition = coords;
        greenMarker.setLngLat(coords);
      } else if (currentMode === 'target') {
        if (!isTargetLocked) {
          targetPosition = coords;
        } else {
          const activeOrigin = userGPSPosition || teePosition;
          const newBearing = getBearing(activeOrigin, coords);
          targetPosition = getDestinationPoint(activeOrigin[0], activeOrigin[1], lockedTargetDistance, newBearing);
        }
        if (targetTouchMarker) targetTouchMarker.setLngLat(targetPosition);
      }
      updateCalculations();
      triggerElevationUpdate();
    });

    map.on('move', () => {
      drawCanvasOverlay();
    });

    map.on('load', () => {
      resizeCanvas();
      fetchWeatherData();
      triggerElevationUpdate();
      updateVersionTag();
    });

    updateModeButtonsUI();
  </script>
</body>
</html>
